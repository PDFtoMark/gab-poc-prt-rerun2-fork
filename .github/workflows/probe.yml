name: prt-probe
on:
  pull_request_target:
    types: [opened, synchronize]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: marker
        run: |
          echo "MARKER=FORK_HEAD_MARKER"
          echo "WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          echo "SHA=$GITHUB_SHA"
          exit 0
